# Data generation for the use case "predict the dark matter mass map from the stellar metallicity map".
#
# Separate from data_generation.yaml (which is not modified). Run it with
#
#   python src/generate_dataset.py --config-name data_generation_dm
#   python src/generate_dataset.py --config-name data_generation_dm catalog=millenium_dm
#
# `--config-name` overrides the name hardcoded in generate_dataset.py, no code change is needed.
#
# The catalog variants (configs/catalog/*_dm.yaml) add the particle fields these features need and write to
# their own dataset directory, e.g. <datasets_dir>/illustris300_dm_v1/no_rotation_s<scale>/<feature>/, so the
# maps never mix with the ones generated by an older version of the code. Their `output` must be a symlink to
# the original snapshot folder (created by hand once, with `ln -s`).
defaults:
  - _self_
  - paths: gpfs
  - catalog: illustris300_dm
#  - catalog: millenium_dm
  - extras: default
  - hydra: default

# task name, determines the output directory path of the run (logs), apart from the other data generations
task_name: "data_generation_dm"

# [input feature, output feature]. Both go through the generic ParticleField processor: `attribute` is
# <particle_type>_<name>, as defined by the `name` tags of the catalog particle fields.
feature_names:
  # input: mass-weighted mean of the stellar metallicity (metal mass fraction, dimensionless) in each pixel
  - name: ParticleField
    attribute: star_metallicity
    weight: star_m
    statistic: weighted_mean
    clip_min: 0.0                 # a few Millennium-TNG values are tiny negatives (about -3e-6)
    label: StellarMetallicity     # output folder name
  # output: dark matter mass in each pixel (Msun/h). No `transition_radius_compute`, so the data loader runs
  # in map mode (the transition radius comes from the catalog)
  - name: ParticleField
    attribute: dm_m
    statistic: sum
    label: DarkMatterMass

# This affects the entire pipeline when computing maps
skip_existing_halos: true

# No rotate_step: rotating particles of several types is not supported yet (SubhaloParticlesV2.rotate), so the
# maps are generated without rotation, in <dataset dir>/no_rotation_s<bin_spatial_resolution_scale>/
pipeline:
  - name: data_loader
    G: 4.30091e-6              # Gravitational constant in units of kpc Msun^-1 (km/s)^2
  - name: map_step
    dim: 2
    n_zooms: 1                 # random zoom windows per projection (xy, yz, xz) and halo
