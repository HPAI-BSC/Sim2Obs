#_target_: src.models.bce_module.BCELitModule
_target_: src.models.mse_module.MSELitModule

optimizer:
  _target_: torch.optim.SGD
  _partial_: true
  lr: 0.001
  weight_decay: 0.0
  momentum: 0.9

scheduler:
  _target_: torch.optim.lr_scheduler.OneCycleLR
  _partial_: true
  max_lr: 0.1
  total_steps: 4000
  pct_start: 0.3
  anneal_strategy: linear  # or 'cos'
  div_factor: 25.0
  final_div_factor: 1e4
  three_phase: false
  interval: step
  frequency: 1

net:
  _target_: src.models.components.UNet.UNet
  n_channels: 1
  n_classes: 1
  bilinear: False

# compile model for faster training with pytorch 2.0
compile: false
