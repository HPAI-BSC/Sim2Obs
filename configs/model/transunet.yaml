_target_: src.models.bce_module.BCELitModule

optimizer:
  _target_: torch.optim.Adam
  _partial_: true
  lr: 0.0001
  weight_decay: 0.0

scheduler:
  _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
  _partial_: true
  mode: min
  factor: 0.1
  patience: 10

net:
  _target_: src.models.components.TransUNet.TransUNet
  n_channels: 1
  n_classes: 1
  n_heads: 16
  patch_size: 16
  mlp_dim: 3072
  img_size: 128
  segmentation_head_kernel_size: 3

# compile model for faster training with pytorch 2.0
compile: false
