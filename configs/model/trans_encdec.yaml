_target_: src.models.bce_module.BCELitModule

optimizer:
  _target_: torch.optim.Adam
  _partial_: true
  lr: 0.0001
  weight_decay: 0.0

scheduler:
  _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
  _partial_: true
  mode: min
  factor: 0.1
  patience: 10

net:
  _target_: src.models.components.TransEncDec.TransEncDec
  in_channels: 1
  out_channels: 1
  n_heads: 2
  n_layers: 3
  dim_feedforward: 1024
  dropout: 0.15

# compile model for faster training with pytorch 2.0
compile: false
