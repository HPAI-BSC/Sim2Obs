_target_: src.models.mamba_module.MambaLitModule

optimizer:
  _target_: torch.optim.Adam
  _partial_: true
  lr: 0.0001
  weight_decay: 0

scheduler:
  _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
  _partial_: true
  mode: min
  factor: 0.05
  patience: 5

net:
  _target_: src.models.components.Mamba_UNet.MambaUNet
  config:
    patch_size: 8
    in_chains: 1
    embed_dim: 1024
    depths: [1, 1, 1, 1]
    mlp_ratio:
    drop_rate: 0.1
    drop_path_rate: 0.1
    patch_norm: True
    use_checkpoint: False
    final_upsample: expand_first  # From [None, 'expand_first']
  num_classes: 1 # aka num out channels
  zero_head: False
  vis: False

# compile model for faster training with pytorch 2.0
compile: false