# @package _global_

# specify here default configuration
# order of defaults determines the order in which configs override each other
defaults:
  - _self_
  - paths: gpfs
  - preprocessing: mnist
  - preprocessing_steps:
      - add_frame
  - hydra: default
  - logger: mlflow

task_name: "preprocess"
parallel: 0
commit_tag: "commit_hash"
