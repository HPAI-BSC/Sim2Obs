defaults:
  - _self_
  - paths: gpfs
  - catalog: tngcluster
#  - catalog: illustris300
  - extras: default
  - hydra: default

# task name, determines output directory path
#task_name: "data_generation_muse"
task_name: "data_generation"

feature_names:
  - name: VelocityDispersion
    simulate_muse: true
  - name: IntraClusterLight
    transition_radius_compute: true

# [angle, z axis, [rotation_axis]]
rotation_45: [ 45, [0, 0, 1], [ [1, 0, 0], [0, 1, 0], [0, 0, 1] ] ]
rotation_90: [ 90, [0, 0, 1], [ [1, 0, 0], [0, 1, 0], [ 0, 0, 1] ] ]
rotation_120: [ 120, [0, 0, 1], [ [1, 0, 0], [0, 1, 0], [0, 0, 1] ] ]

pipeline:
  - name: data_loader
    G: 4.30091e-6              # Gravitational constant in units of kpc Msun^-1 (km/s)^2
#  - name: map_step
#    dim: 2 # new
#    n_zooms: 3




