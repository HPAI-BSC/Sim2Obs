# Illustris-300 (TNG300) for the use case "dark matter mass from stellar metallicity".
#
# Same simulation, snapshot and parameters as illustris300.yaml (inherited, that file is not modified),
# plus the particle fields the new features need. Use it with `catalog=illustris300_dm`.
#
# `particles_v2: true` switches the fetcher to SubhaloParticlesV2 (one overlap boundary per particle type),
# takes the constant dark matter mass from the snapshot header and loads only stars for the overlapping
# neighbour subhalos. Catalogs without the flag behave exactly as before.
#
# Attribute names are <particle_type>_<name>: star_metallicity, star_formation_time, dm_p, dm_m.
defaults:
  - illustris300
  - _self_

particles_v2: true

# Own dataset directory, so the maps (<path>/no_rotation_s<scale>/<feature>/), the overlap matrix cache and
# the logs of this version never mix with the ones generated by an older version of the code. Bump the suffix
# (_v2, ...) when the code changes. The snapshot data is not copied: <path>/output must be a symlink to the
# original `output` folder (created by hand once, with `ln -s`). The name has to keep the 'illustris300'
# marker, which the fetcher uses to pick the subhalo parent field.
path: ${paths.datasets_dir}/illustris300_dm_v1

fields:
  particles:
    star:
      GFM_Metallicity:
        # total metal mass fraction inherited from the birth gas cell, dimensionless
        input: null
        output: null
        scaling: null
        name: "metallicity"
      GFM_StellarFormationTime:
        # scale factor of birth, > 0 for real stars and <= 0 for wind cells: the filter drops the wind cells
        input: null
        output: null
        scaling: null
        name: "formation_time"
        filter: ["> 0"]
    dm:
      # the key must be 'dm' (illustris_python does not know 'dark_matter')
      Coordinates:
        input: "ckpc/h"
        output: "pkpc/h"
        scaling: "x * a"
        name: "p"
      Masses:
        # not a snapshot dataset: dark matter has one mass, the header MassTable[1], which the fetcher uses
        # to fill this field (10^10 Msun/h), so the conversion below applies to it as to any other mass
        input: "10^10 Msun/h"
        output: "Msun/h"
        scaling: "x * 1e10"
        name: "m"
