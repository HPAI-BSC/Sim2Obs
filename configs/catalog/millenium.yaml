name: illustris-300
snapnum: 237       # redshift 0.25
a: 0.8
H: 0.6774

spatial_resolution: 2.02 # kpc TODO BE REVIEWED

# bin_size = spatial_resolution * 1 ->
# ensure that bins use a proper resolution,
#bin_size > spatial resolution *1.5-2 times
# bin_size = 3.6, sp resolution = 2.02
bin_spatial_resolution_scale: 1.5

# https://www.mtng-project.org/01_sims/

# Lbox: 31.25 * 1000 # kpc/h
# path: ${paths.datasets_dir}/millenium/MTNG-L31.25-270-A

# transition_radius: 350 # kpc
# Lbox: 125000 # kpc/h
# path: ${paths.datasets_dir}/millenium/MTNG-L125-1080-A
#ignore_halos: []

# transition_radius: XX # kpc
#Lbox: 62500 # kpc/h
#path: ${paths.datasets_dir}/millenium/MTNG-L62.5-540-A
#ignore_halos: []

# transition_radius: XX # kpc
Lbox: 500000 # kpc/h
path: ${paths.datasets_dir}/millenium/MTNG-L500-4320-A
# ignore_halos: []

fields:
  halo:
    Group_M_Crit200:
      input: "10^10 Msun/h"
      output: "Msun/h"
      scaling: "x * 1e10"
      name: "m200"
      # Mass > (1e13 * H) M⊙/h
      filter: ["> 1e13 * 0.6774"]
    Group_R_Crit200:
      input: "cMpc/h"
      output: "pkpc/h"
      scaling: "x * a * 1000"
      name: "r200"
    GroupPos:
      input: "cMpc/h"
      output: "pkpc/h"
      scaling: "x * a * 1000"
      name: "gpos"
    GroupFirstSub:
      input: null
      output: null
      scaling: null
      name: "fsub"
  subhalo:
    SubhaloPos:
      input: "cMpc/h"
      output: "pkpc/h"
      scaling: "x * a * 1000"
      name: "spos"
    SubhaloHalfmassRadType:
      input: "cMpc/h"
      output: "pkpc/h"
      scaling: "x * a * 1000"
      index: 4 # Select the 5th column (stars)
      name: "shmr"
    SubhaloMassType:
      input: "10^10 Msun/h"
      output: "Msun"
      scaling: "x * 1e10 / h"
      index: 4
      name: "mstr"
      # Mass > 1e10 M⊙
      filter: "> 1e10 "
    SubhaloGroupNr:
      input: null
      output: null
      scaling: null
      name: "id_parents"
  particles:
    star:
      # <part_type>_<name>
      Coordinates:
        input: "cMpc/h"
        output: "pkpc/h"
        scaling: "x * a * 1000"
        name: "p"
      Velocities:
        input: "kma/s^-1"
        output: "km/s^-1"
        scaling: "x * math.sqrt(a)"
        name: "v"
      Masses:
        input: "10^10 Msun/h"
        output: "Msun/h"
        scaling: "x * 1e10"
        name: "m"
    gas:
      Masses:
        input: "10^10 Msun/h"
        output: "Msun/h"
        scaling: "x * 1e10"
        name: "m"


