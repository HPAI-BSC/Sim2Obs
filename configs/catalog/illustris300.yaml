name: illustris-300
subhalo_error_id: 4294967295
snapnum: 84       # redshift 0.2
a: 0.8333     # redshift 0.2
H: 0.6774
# https://www.tng-project.org/data/docs/background/
Lbox: 205000 # box size in kpc/h
transition_radius: 637.031 # kpc
spatial_resolution: 1.480 # kpc
# bin_size = spatial_resolution * 1 ->
# ensure that bins use a proper resolution,
#bin_size > spatial resolution *1.5-2 times
bin_spatial_resolution_scale: 1.5

path: ${paths.datasets_dir}/illustris300


fields:
  halo:
    Group_M_Crit200:
      input: "10^10 Msun/h"
      output: "Msun/h"
      scaling: "x * 1e10"
      name: "m200"
      # Final units 1e13M⊙ to 6.77*1e12 M⊙/h
      filter: ["> 1e13 * 0.6774"]
    Group_R_Crit200:
      input: "ckpc/h"
      output: "pkpc/h"
      scaling: "x * a"
      name: "r200"
    GroupPos:
      input: "ckpc/h"
      output: "pkpc/h"
      scaling: "x * a"
      name: "gpos"
    GroupFirstSub:
      input: null
      output: null
      scaling: null
      name: "fsub"
  subhalo:
    SubhaloPos:
      input: "ckpc/h"
      output: "pkpc/h"
      scaling: "x * a"
      name: "spos"
    SubhaloHalfmassRadType:
      input: "ckpc/h"
      output: "pkpc/h"
      scaling: "x * a"
      index: 4 # Select the 5th column (stars)
      name: "shmr"
    SubhaloMassType:
      input: "10^10 Msun/h"
      output: "Msun"
      scaling: "x * 1e10 / h"
      index: 4
      name: "mstr"
      # Mass > 1e10 M⊙
      filter: "> 1e10 "
    SubhaloGrNr:
      input: null
      output: null
      scaling: null
      name: "id_parents"
  particles:
    star:
      # <part_type>_<name>
      Coordinates:
        input: "ckpc/h"
        output: "pkpc/h"
        scaling: "x * a"
        name: "p"
      Velocities:
        input: "kma/s^-1"
        output: "km/s^-1"
        scaling: "x * math.sqrt(a)"
        name: "v"
      Masses:
        input: "10^10 Msun/h"
        output: "Msun/h"
        scaling: "x * 1e10"
        name: "m"

# 94 halos
ignore_halos: [1537, 1018, 509, 517, 2569, 1043, 2069, 2071, 2072, 2075, 2082, 1572, 1580, 2609, 2101, 3126, 1085,
               1604, 1097, 2129, 2130, 4178, 599, 1633, 1122, 1661, 2175, 1666, 2182, 1159, 3216, 2712, 2204, 159,
               1696, 1200, 2226, 699, 708, 198, 1736, 1225, 717, 2768, 1236, 728, 729, 2270, 2782, 737, 1249, 227,
               231, 1768, 2796, 1776, 2813, 1801, 2313, 1291, 789, 1815, 1823, 1825, 1826, 804, 1348, 1355, 844,
               1867, 335, 851, 341, 1368, 2411, 1388, 3960, 387, 1422, 402, 1429, 1948, 1444, 1448, 2481, 454,
               1491, 982, 2538, 494, 2545, 3058, 1530, 1533]