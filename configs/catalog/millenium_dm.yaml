# Millennium-TNG (MTNG-L500-4320-A) for the use case "dark matter mass from stellar metallicity".
#
# Same simulation, snapshot and parameters as millenium.yaml (inherited, that file is not modified, its gas
# block included), plus the particle fields the new features need. Use it with `catalog=millenium_dm`.
#
# `particles_v2: true` switches the fetcher to SubhaloParticlesV2 (one overlap boundary per particle type),
# takes the constant dark matter mass from the snapshot header and loads only stars for the overlapping
# neighbour subhalos. Catalogs without the flag behave exactly as before.
#
# Attribute names are <particle_type>_<name>: star_metallicity, star_formation_time, dm_p, dm_m.
# Positions are in cMpc/h in this snapshot, hence the factor 1000 to pkpc/h, as in the star block.
defaults:
  - millenium
  - _self_

particles_v2: true

# Own dataset directory, so the maps (<path>/no_rotation_s<scale>/<feature>/), the overlap matrix cache and
# the logs of this version never mix with the ones generated by an older version of the code. Bump the suffix
# (_v2, ...) when the code changes. The snapshot data is not copied: <path>/output must be a symlink to the
# original `output` folder (created by hand once, with `ln -s`). The name has to keep the 'millenium'
# marker, which the fetcher uses to pick the subhalo parent field.
path: ${paths.datasets_dir}/millenium/MTNG-L500-4320-A_dm_v1

# Periodic box length for the recentring of the particles and subhalos (preprocess), in the units of the positions.
# The positions are scaled to PHYSICAL kpc/h (`x * a`) but the original catalog gives the COMOVING box length
# (500000), so a halo that straddles a face of the box was wrapped with the wrong length: 5 to 14% of the
# particles of such halos ended up about 100 Mpc away (measured on real MTNG halos at the box edge). The box
# length that fits the positions is Lbox * a = 500000 * 0.8, with the `a` of this catalog.
Lbox: 400000.0

fields:
  particles:
    star:
      GFM_Metallicity:
        # total metal mass fraction, dimensionless. A few values are tiny negatives (about -3e-6): the
        # ParticleField feature clips them with `clip_min: 0`
        input: null
        output: null
        scaling: null
        name: "metallicity"
      GFM_StellarFormationTime:
        # scale factor of birth, > 0 for real stars and <= 0 for wind cells: the filter drops the wind cells
        input: null
        output: null
        scaling: null
        name: "formation_time"
        filter: ["> 0"]
    dm:
      # the key must be 'dm' (illustris_python does not know 'dark_matter')
      Coordinates:
        input: "cMpc/h"
        output: "pkpc/h"
        scaling: "x * a * 1000"
        name: "p"
      Masses:
        # not a snapshot dataset: dark matter has one mass, the header MassTable[1], which the fetcher uses
        # to fill this field (10^10 Msun/h), so the conversion below applies to it as to any other mass
        input: "10^10 Msun/h"
        output: "Msun/h"
        scaling: "x * 1e10"
        name: "m"
