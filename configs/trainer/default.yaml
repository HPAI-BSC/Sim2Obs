_target_: lightning.pytorch.trainer.Trainer

default_root_dir: ${paths.output_dir}

min_epochs: 1 # prevents early stopping
max_epochs: 50
#max_steps: 1000  # For Stochastic Interpolation Models

gradient_clip_val: 1.0

accelerator: gpu
devices: 1

accumulate_grad_batches: 4

#callbacks:
#  - _target_: lightning.pytorch.callbacks.DeviceStatsMonitor
#    cpu_stats: True
#    gpu_stats: True
#  - _target_: lightning.pytorch.callbacks.StochasticWeightAveraging
#    swa_lrs: 1e-2

# (optional) mixed precision for extra speed-up
#precision: "bf16-mixed"

# perform a validation loop every N training epochs
check_val_every_n_epoch: 10

# set True to to ensure deterministic results
# makes training slower but gives more reproducibility than just setting seeds
deterministic: False
